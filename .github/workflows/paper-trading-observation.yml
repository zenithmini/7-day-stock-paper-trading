name: Offline safety tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed ref 2026-09-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, reviewed ref 2026-09-20
        with:
          python-version: '3.12'
      - name: Install pinned Windows timezone database
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check tzdata==2025.2
      - name: Run offline regression tests
        run: python -B run_tests.py
